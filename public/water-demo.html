<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>水滴记</title>
  <style>
    * { box-sizing: border-box; }
    main { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas:focus:not(:focus-visible) { outline: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; color: #000; font-family: system-ui, sans-serif; }
    main { position: fixed; inset: 0; background: #fff; isolation: isolate; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; outline-offset: -6px; }
    :root { --page-heading-size:26px; --page-heading-top:max(76px,calc(env(safe-area-inset-top,0px) + 52px)); }
    header { position: absolute; top: var(--page-heading-top); left: 28px; right: 28px; pointer-events: none; color: var(--water-ink,#000); z-index: 1; }
    #lightHeader { position:absolute; inset:0; z-index:1; pointer-events:none; clip-path:url(#inkClip); }
    #lightHeader header { color:#fff; }
    main.settings-open #lightHeader { visibility:hidden; }
    .month-value { display:block; font:400 var(--page-heading-size)/1.35 system-ui,sans-serif; font-variant-numeric:tabular-nums; }
    .amount-digit { display:inline-block; width:1ch; height:1.35em; overflow:hidden; vertical-align:top; }
    .amount-strip { display:block; will-change:transform; }
    .amount-strip > span { display:block; height:1.35em; line-height:1.35; }
    #inlineCategories details { margin:8px 0; }
    #inlineCategories summary, .inline-category-row { display:flex; align-items:center; gap:8px; min-height:44px; border-bottom:1px solid #ffffff30; }
    #inlineCategories summary { cursor:pointer; }
    #inlineCategories summary span, .inline-category-row span { flex:1; }
    .inline-category-children { padding-left:14px; }
    #inlineCategories button { font-size:20px; }
    .month-label { position:absolute; bottom:calc(100% + 9px); margin:0; font:400 15px/1.35 system-ui,sans-serif; }
    #monthAmount { display:block; font:400 var(--page-heading-size)/1.35 system-ui,sans-serif; font-variant-numeric:tabular-nums; }
    #settingsPage { position: absolute; inset: 0; z-index: 4; color: var(--ink-text,#fff); padding: 40px 28px; transform: translateY(100%); pointer-events: none; visibility: hidden; overflow-y: auto; }
    main.settings-open header { visibility: hidden; }
    main.settings-open #settingsPage { visibility: visible; transform: translateY(0); pointer-events: auto; }
    #settingsBack { padding: 0; width: 44px; text-align: left; font-size: 30px; }
    #settingsPage h2 { margin: 24px 0 28px; font-size: 24px; font-weight: 400; }
    .settings-section { margin: 0 0 26px; }
    .settings-section h3 { font-size: 15px; font-weight: 400; margin: 0 0 14px; }
    #openCategories { border: 1px solid #777; border-radius: 10px; width: 100%; text-align: left; padding: 14px; font-size: 15px; }
    #inkOptions { display: flex; flex-wrap: wrap; gap: 14px; }
    #inkOptions button { width: 36px; height: 36px; min-height: 36px; border-radius: 50%; border: 2px solid #aaa; padding: 0; }
    #inkOptions button[aria-checked="true"] { outline: 2px solid var(--ink-text,#fff); outline-offset: 4px; }
    #monthlyQuota { color: var(--ink-text,#fff) !important; }
    #recordFrame { z-index: 5 !important; }
    #settingsPage label { display: block; font-size: 14px; color: #999; }
    .quota-input { display: flex; align-items: center; gap: 12px; margin: 18px 0 26px; border-bottom: 1px solid #444; padding-bottom: 12px; font-size: 32px; }
    #monthlyQuota { width: 100%; min-width: 0; background: none; border: 0; outline: none; color: #fff; font: 300 40px system-ui; }
    #saveQuota { border: 1px solid #555; border-radius: 24px; padding: 10px 28px; font-size: 15px; }
    #quotaStatus { font-size: 13px; color: #aaa; min-height: 20px; }
    #updateActions { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
    #updateActions button, #releasePageLink { font:400 15px system-ui; color:inherit; padding:10px 0; text-decoration:none; }
    #updateStatus, #appVersionLabel { font:400 13px/1.6 system-ui; color:inherit; opacity:.65; }
    #downloadUpdate[hidden] { display:none; }
    #loginPage { position:absolute; inset:0; z-index:4; padding:36px 28px; color:var(--water-ink,#000); background:#fff; transform:translateY(-100%); visibility:hidden; pointer-events:none; overflow-y:auto; }
    main.login-open #loginPage { visibility:visible; pointer-events:auto; }
    main > header, #lightHeader { opacity:1; }
    #loginBack { font-size:30px; padding:0; width:44px; text-align:left; }
    #loginPage h2 { margin:26px 0 32px; font-size:26px; font-weight:400; }
    #loginForm { display:grid; gap:22px; max-width:420px; }
    #loginForm label { display:grid; gap:10px; font-size:14px; }
    #loginForm input { width:100%; box-sizing:border-box; min-height:44px; border:0; border-bottom:1px solid #bbb; border-radius:0; background:transparent; color:inherit; font:18px system-ui; outline-offset:4px; }
    #loginForm details { font-size:13px; color:#777; }
    #loginForm details label { margin-top:18px; }
    #loginSubmit { background:var(--water-ink,#000); color:#fff; border-radius:28px; font-size:16px; }
    #loginSubmit:disabled { opacity:.5; }
    #loginLogout { border:1px solid currentColor; border-radius:28px; font-size:16px; }
    #loginStatus { font-size:14px; min-height:20px; margin:0; line-height:1.5; overflow-wrap:anywhere; }
    @media (max-height: 700px) {
      #settingsPage { padding: 24px; }
      #settingsPage h2 { margin: 12px 0 20px; }
      .settings-section { margin-bottom: 18px; }
      .quota-input { margin: 12px 0 18px; padding-bottom: 8px; }
      #monthlyQuota { font-size: 32px; }
    }
    #settingsPage, #loginPage { padding-bottom:calc(40px + var(--keyboard-gap,0px)); overscroll-behavior:contain; }
    #settingsPage, #loginPage { padding-top:var(--page-heading-top); padding-left:28px; padding-right:28px; }
    #settingsPage h2, #loginPage h2 { margin:0 0 28px; font:400 var(--page-heading-size)/1.35 system-ui,sans-serif; }
    #settingsBack, #loginBack { position:absolute; top:calc(var(--page-heading-top) - 56px); left:28px; }
    #settingsPage input, #loginPage input { scroll-margin-block:24px; }
    #sideDisk { position:absolute; width:100px; height:100px; border-radius:50%; background:#000; z-index:3; pointer-events:none; transform-origin:center; will-change:transform; }
    #sideDiskFill { position:absolute; inset:0; border-radius:50%; background:#fff; transform-origin:center; }
    #sidePage { position:absolute; left:0; top:0; width:0; height:0; z-index:4; color:#000; visibility:hidden; touch-action:none; border-radius:50%; overflow:hidden; isolation:isolate; transform-origin:center; will-change:transform; }
    #sideViewport { position:absolute; width:100vw; height:100vh; background:#fff; transform-origin:0 0; will-change:transform; }
    #sideBack { font-size:30px; padding:0; width:44px; text-align:left; }
    #sideBack { position:absolute; top:20px; left:24px; z-index:2; }
    #sideFrame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; visibility:hidden; }
    #sidePage h2 { margin:26px 0 14px; font-size:26px; font-weight:400; }
    #sidePage p { font-size:14px; opacity:.55; }
    h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: .2em; }
    header > div { display: flex; flex-wrap: wrap; justify-content: flex-end; }
    header { gap: 12px; }
    h1 { flex-shrink: 0; }
    button { pointer-events: auto; border: 0; background: transparent; padding: 12px; min-height: 44px; color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
    .hint { position: absolute; top: 24%; width: 100%; text-align: center; pointer-events: none; }
    .hint p { margin: 0 0 10px; font-size: 15px; letter-spacing: .12em; }
    .hint small { font-size: 11px; color: #666; letter-spacing: .08em; }
    footer { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); width: 100%; text-align: center; pointer-events: none; font-size: 11px; letter-spacing: .15em; color: #fff; mix-blend-mode: difference; }
    #count { font-size: 24px; display: block; margin-bottom: 6px; font-variant-numeric: tabular-nums; font-weight: 400; }
    main.entry-open .hint, main.entry-open footer { visibility: hidden; pointer-events: none; }
    #entryDisk { position: absolute; border-radius: 50%; background: #000; pointer-events: none; transform-origin: center; will-change: transform; z-index: 2; }
    #entryDisk[hidden] { display: none; }
    #recordFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 3; background: #000; }
    #recordFrame[hidden] { display: block; visibility: hidden; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <canvas id="water" tabindex="0" role="button" aria-label="记一笔消费"></canvas>
    <div id="entryDisk" hidden aria-hidden="true"></div>
    <iframe id="recordFrame" name="water-record-preview" title="记账" hidden></iframe>
    <header aria-label="本月支出"><p class="month-label">本月支出</p><span id="monthAmount">¥0.00</span></header>
    <svg width="0" height="0" aria-hidden="true"><defs><clipPath id="inkClip" clipPathUnits="userSpaceOnUse"><path id="waterTextClip"/></clipPath></defs></svg>
    <div id="lightHeader" aria-hidden="true"><header><p class="month-label">本月支出</p><span id="lightMonthAmount" class="month-value">¥0.00</span></header></div>
    <section id="settingsPage" aria-label="账户与额度" aria-hidden="true" inert>
      <button id="settingsBack" type="button" aria-label="返回">‹</button>
      <h2>设置</h2>
      <div class="settings-section"><h3>分类</h3><div id="inlineCategories"></div><button id="addInlineCategory" type="button" aria-label="添加一级分类">＋</button></div>
      <div class="settings-section"><h3>配色</h3><div id="inkOptions" role="radiogroup" aria-label="水体配色">
        <button type="button" data-ink="#000000" style="background:#000000" role="radio" aria-label="黑色"></button>
        <button type="button" data-ink="#234b40" style="background:#234b40" role="radio" aria-label="墨绿"></button>
        <button type="button" data-ink="#263e68" style="background:#263e68" role="radio" aria-label="深蓝"></button>
        <button type="button" data-ink="#00105C" style="background:#00105C" role="radio" aria-label="藏蓝"></button>
        <button type="button" data-ink="#654058" style="background:#654058" role="radio" aria-label="暗紫"></button>
        <button type="button" data-ink="#854536" style="background:#854536" role="radio" aria-label="赭红"></button>
      </div></div>
      <div class="settings-section"><h3>额度</h3>
      <label for="monthlyQuota">每月总额度</label>
      <div class="quota-input"><span>¥</span><input id="monthlyQuota" type="number" inputmode="decimal" min="0.01" step="0.01" value="8000" aria-label="每月总额度"></div>
      <button id="saveQuota" type="button">保存</button><p id="quotaStatus" role="status"></p></div>
      <div class="settings-section"><h3>更新</h3><p id="appVersionLabel"></p>
        <div id="updateActions"><button id="checkUpdate" type="button">检查更新</button><button id="downloadUpdate" type="button" hidden>下载新版</button><a id="releasePageLink" href="https://github.com/cnjialin/budgetgauge/releases" target="_blank" rel="noopener noreferrer">GitHub</a></div>
        <p id="updateStatus" role="status" aria-live="polite"></p>
      </div>
    </section>
    <div id="sideDisk" hidden><div id="sideDiskFill"></div></div>
    <section id="sidePage" aria-label="侧页动画预览" aria-hidden="true" inert>
      <div id="sideViewport">
      <button id="sideBack" aria-label="返回主页">‹</button>
      <iframe id="sideFrame" name="water-page-preview" title="历史记录与统计"></iframe>
      </div>
    </section>
    <section id="loginPage" aria-label="账号登录" aria-hidden="true" inert>
      <button id="loginBack" type="button" aria-label="返回">‹</button><h2>登录</h2>
      <form id="loginForm">
        <label>邮箱<input id="loginEmail" type="email" autocomplete="username" required placeholder="输入邮箱"></label>
        <label>密码<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="输入密码"></label>
        <details id="loginConnection"><summary>连接设置</summary>
          <label>Supabase URL<input id="loginUrl" type="url" placeholder="https://项目.supabase.co" autocomplete="url"></label>
          <label>Supabase Key<input id="loginKey" type="text" placeholder="publishable / anon key" autocapitalize="off" spellcheck="false" autocomplete="off"></label>
        </details>
        <button id="loginSubmit" type="submit">登录</button><button id="loginLogout" type="button" hidden>退出登录</button>
        <button id="loginReconnect" type="button" hidden>重新连接（无需密码）</button>
        <p id="loginStatus" role="status"></p>
        <p id="ledgerStatus" role="status"></p>
        <button id="ledgerRefresh" type="button" hidden>刷新消费记录</button>
      </form>
    </section>
    <div hidden aria-hidden="true"><button id="motion" type="button"></button><button id="tilt" type="button"></button><button id="reset" type="button"></button><span id="status"></span><span id="count"></span><span id="caption"></span></div>
  </main>
  <script id="recordBundle" type="application/json">"﻿\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>Budget Gauge\u003c/title>\n  \n  \n  \n  \n\u003cstyle>﻿:root {\n  --app-viewport-height: 100vh;\n  --app-viewport-unit: calc(var(--app-viewport-height) / 100);\n  --keyboard-inset: 0px;\n  --bg: #050b14;\n  --panel: rgba(10, 18, 33, 0.88);\n  --panel-border: rgba(255, 255, 255, 0.08);\n  --text: #eef5ff;\n  --muted: #98abc5;\n  --accent: #69f0c3;\n  --blue: #6f9dff;\n  --page-bg: #f8fbff;\n  --page-text: #303842;\n  --page-muted: #8a929c;\n  --page-blue: #347ff7;\n  --page-cyan: #5de0cf;\n  --page-bg-top: #ffffff;\n  --page-bg-bottom: #f8fbff;\n  --page-title: #343c47;\n  --page-accent-rgb: 52, 127, 247;\n  --gauge-value-start: #69f0c3;\n  --gauge-value-mid: #89f6ff;\n  --gauge-value-end: #6f9dff;\n  --gauge-reference: rgba(222, 227, 233, 0.84);\n  --gauge-tick: rgba(176, 183, 193, 0.36);\n  --history-scrollbar-track: rgba(255, 255, 255, 0.08);\n  --history-scrollbar-start: rgba(158, 245, 216, 0.95);\n  --history-scrollbar-end: rgba(118, 167, 255, 0.95);\n  --history-scrollbar-hover-start: rgba(176, 249, 226, 0.98);\n  --history-scrollbar-hover-end: rgba(132, 179, 255, 0.98);\n  --history-bar-track: rgba(255, 255, 255, 0.06);\n  --history-bar-shadow: rgba(105, 240, 195, 0.16);\n  --history-muted-text: #6f7d8d;\n  --history-subtle-text: #7d8a98;\n  --add-btn-start: #59d6ee;\n  --add-btn-end: #437cff;\n  --add-btn-shadow: rgba(52, 127, 247, 0.28);\n}\n\nbody[data-theme=\"forest\"] {\n  --page-bg-top: #fcfcfa;\n  --page-bg-bottom: #f8f7f3;\n  --page-text: #14342b;\n  --page-muted: #7e8581;\n  --page-blue: #2f5d4f;\n  --page-cyan: #7bb39d;\n  --page-title: #14342b;\n  --page-accent-rgb: 47, 93, 79;\n  --gauge-value-start: #89bea7;\n  --gauge-value-mid: #5f9a83;\n  --gauge-value-end: #2f5d4f;\n  --gauge-reference: rgba(226, 223, 214, 0.92);\n  --gauge-tick: rgba(188, 181, 168, 0.42);\n  --history-scrollbar-track: rgba(231, 228, 219, 0.72);\n  --history-scrollbar-start: rgba(137, 190, 167, 0.96);\n  --history-scrollbar-end: rgba(47, 93, 79, 0.96);\n  --history-scrollbar-hover-start: rgba(151, 200, 178, 0.98);\n  --history-scrollbar-hover-end: rgba(35, 78, 65, 0.98);\n  --history-bar-track: rgba(226, 223, 214, 0.66);\n  --history-bar-shadow: rgba(47, 93, 79, 0.16);\n  --history-muted-text: #4f625b;\n  --history-subtle-text: #62736c;\n  --add-btn-start: #416f60;\n  --add-btn-end: #183f34;\n  --add-btn-shadow: rgba(24, 63, 52, 0.28);\n}\n\n* {\n  box-sizing: border-box;\n}\n\nhtml,\nbody {\n  margin: 0;\n  width: 100%;\n  height: var(--app-viewport-height);\n  overflow: hidden;\n  overscroll-behavior: none;\n}\n\nbody {\n  height: var(--app-viewport-height);\n  min-height: 100vh;\n  min-height: var(--app-viewport-height);\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: auto;\n  display: grid;\n  place-items: center;\n  font-family: \"Space Grotesk\", sans-serif;\n  color: var(--text);\n  touch-action: manipulation;\n  background:\n    radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.96), transparent 28%),\n    linear-gradient(180deg, var(--page-bg-top) 0%, var(--page-bg-bottom) 100%);\n}\n\nbody *:not(a):not(input):not(textarea):not(select):not(option):not([contenteditable=\"true\"]) {\n  -webkit-user-select: none;\n  user-select: none;\n  -webkit-touch-callout: none;\n  -webkit-tap-highlight-color: transparent;\n}\n\na,\ninput,\ntextarea,\nselect,\noption,\n[contenteditable=\"true\"] {\n  -webkit-user-select: auto;\n  user-select: auto;\n}\n\n.gauge-page {\n  --record-ring-top-boundary: calc(176px + env(safe-area-inset-top, 0px));\n  --record-ring-bottom-boundary: calc(112px + env(safe-area-inset-bottom, 0px));\n  --record-ring-max-size: 760px;\n  --record-ring-size: min(\n    calc(100vw - 20px),\n    calc(var(--app-viewport-height) - 2 * var(--record-ring-top-boun     if (entry.state !== 'black' || !editorOpened) return;
    if (event.data.action === 'cancel') { closeRecordEditor(false); return; }
    if (event.data.action !== 'save') return;
    try {
      const record = event.data.record;
      if (!record || !Number.isFinite(record.amount) || record.amount <= 0 || !Number.isFinite(new Date(record.time).getTime())) throw new Error('请检查金额和时间');
      if(ledgerOwner) {
        const random=crypto.getRandomValues(new Uint32Array(3));
        const id=-(1+(random[0]&0xfffff)*4294967296+random[1]);
        // money.time is unique; retain the selected second with a stable random microsecond suffix.
        const time=new Date(record.time).toISOString().replace(/\.\d{3}Z$/,'.'+String(random[2]%1000000).padStart(6,'0')+'Z');
        cacheLedger(cloudRecords,[...pendingRecords,{...record,id,time,operation:'save',operationId:crypto.randomUUID()}]);
        updateMonthTotal(false,true);entry.amount=record.amount;
        recordFrame.contentWindow.postMessage({channel:'water-editor',action:'save-result'},'*');
        closeRecordEditor(true);ledgerStatus(`${pendingRecords.length} 笔待同步`);scheduleSync();
        return;
      }
      const history = JSON.parse(localStorage.getItem('water-demo-records') || '[]');
      if (!Array.isArray(history)) throw new Error('本地演示记录无法读取');
      const saved = { amount: record.amount, category: record.category, purpose: record.purpose, time: record.time, id: Date.now() };

  });

  function tapScreen(x = width / 2, y = height / 2) {
    if (entry.state === 'water') {
      if (!hasRecordEditor && count + drops.filter(d => !d.landed).length >= maxDrops) return;
      entry.x = clamp(x, dropRadius(), width - dropRadius());
      entry.y = clamp(y, dropRadius(), height - dropRadius());
      entry.elapsed = 0;
      entry.emitDrop = true;
      prepareRecordEditor();
      editorOpened = false;
      entry.state = animate ? 'expanding' : 'black';
      stage.classList.add('entry-open');
      canvas.setAttribute('aria-label', '黑色记账占位界面，再次点击收缩为水滴');
    } else if (entry.state === 'black') {
      if (hasRecordEditor) return;
      entry.elapsed = 0;
      entry.state = 'shrinking';
      if (!animate) finishEntry();
    }
    // Ignore extra taps during transitions so one complete cycle emits one drop.
    if (!entryAnimation) renderEntry();
  }

  function finishEntry() {
    entryAnimation?.cancel();
    entryAnimation = null;
    entry.state = 'water';
    if(monthAmountDeferred)beginMonthAmountMotion();
    stage.classList.remove('entry-open');
    canvas.setAttribute('aria-label', '点击展开黑色界面，再次点击化成水滴');
    if (entry.emitDrop) addDrop(entry.x, entry.y, true);
    draw();
    entryDisk.hidden = true;
  }

  function updateEntry(dt) {
    entry.elapsed += dt;
    if(entry.state==='expanding') {
      // Use the compositor clock: reveal the prepared editor on the first fully covered frame.
      const elapsed=entryAnimation ? Math.max(0,Number(entryAnimation.currentTime)||0)/1000 : entry.elapsed;
      const full=coverRadius(), radius=3+(full-3)*transitionEase(clamp(elapsed/expandDuration,0,1),true);
      if(radius>=full-2) { entry.state='black';renderEntry();return; }
    }
    if (entryAnimation) return;
    if (entry.state === 'expanding' && entry.elapsed >= expandDuration) entry.state = 'black';
    else if (entry.state === 'shrinking' && entry.elapsed >= shrinkDuration) { finishEntry(); return; }
    renderEntry();
  }
  const STEP = 1 / 120;
  const maxDrops = 60;
  const level = () => height * (1 - (hasRecordEditor ? clamp(monthlySpent / monthlyQuota, 0, 1) : .055 + .325 * count / maxDrops));
  const gravity = () => Math.min(1600, height * 1.7);
  const gaussian = x => Math.exp(-x * x / 2);

  let waterNormal = {x:0,y:1}, waterOffset=0, tangentMin=0, tangentMax=1;
  function clippedPool(offset) {
    const left=0,right=width;
    const corners=[{x:left,y:0},{x:right,y:0},{x:right,y:height},{x:left,y:height}], polygon=[];
    for(let i=0;i<4;i++) {
      const a=corners[i],b=corners[(i+1)%4];
      const da=a.x*waterNormal.x+a.y*waterNormal.y-offset,db=b.x*waterNormal.x+b.y*waterNormal.y-offset;
      if(da>=0)polygon.push(a);
      if((da>=0)!==(db>=0)) { const t=da/(da-db);polygon.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}); }

  }
  function balanceWater() {
    waterNormal={x:-Math.sin(tilt),y:Math.cos(tilt)};
    const left=0,right=width;
    const n=waterNormal, projections=[left*n.x,right*n.x,left*n.x+height*n.y,right*n.x+height*n.y];
    let low=Math.min(...projections),high=Math.max(...projections);
    const area=Math.min(width*clamp(height-base,0,height),Math.max(0,right-left)*height);
    for(let i=0;i<24;i++) {
      const mid=(low+high)/2, p=clippedPool(mid);
      let a=0;for(let j=0;j<p.length;j++){const b=p[(j+1)%p.length];a+=p[j].x*b.y-b.x*p[j].y;}

  function resize() {
    const oldWidth = width || innerWidth;
    const oldHeight = height || innerHeight;

    height = innerHeight;
    waterStars = [];
    starCurrent = 0;
    entry.x *= width / oldWidth;
    entry.y *= height / oldHeight;
    const scale = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    displacement = new Float64Array(N);
    velocity = new Float64Array(N);
    impacts = [];

      particle.y *= height / oldHeight;

        particle.wallFront *= height / oldHeight;
        particle.wallTail *= height / oldHeight;

    displacement.fill(0);
    velocity.fill(0);

  }

  function localSurface(x) {
    let offset = 0;
    for (const hit of impacts) {
      const t = hit.age;
      const r = hit.radius;
      const poolDepth = Math.max(0, height - base);
      const depth = Math.min(r * 2.35, poolDepth * .80);
      // A widening cavity displaces water into two shoulders, then collapses.
      const cavity = Math.sin(Math.PI * Math.min(1, t / .32)) ** 2;
      const spread = r * (1.1 + t * 3);
      const d = (x - hit.x) / spread;
      offset += depth * cavity * (gaussian(d) - .5 * gaussian(d / 2));

      const phase = (t - .22) / .34;
      if (phase > 0 && phase < 1) {

        const moundWidth = r * (1.4 + .5 * phase);
        offset -= r * .55 * envelope * gaussian((x - hit.x) / moundWidth);

  function waveOffset(x) {
    const p = Math.max(0, Math.min(N - 1, x / width * (N - 1)));
    const i = Math.floor(p);

  }

  function impact(x, strength, radius = 10) {
    for (let i = 0; i < N; i++) {

  }

  function land(drop) {
    if(!drop.cosmetic){

    }
    if (!animate) return;
    const hitX=waveX(drop.x,drop.y);
    impact(hitX, Math.min(275, Math.hypot(drop.vx, drop.vy) * .40), drop.radius);

  function addDrop(x = width / 2, y = height / 2, released = false, cosmetic = false) {
    if (!cosmetic && !hasRecordEditor && count + drops.filter(d => !d.landed).length >= maxDrops) return;
    const radius = cosmetic ? 10 : dropRadius();
    const drop = { x: clamp(x, radius, width - radius), y: clamp(y, radius, height - radius), vx: 0, vy: 0, age: released ? .12 : 0, radius, cosmetic };

    if (touchesWater(drop.x,drop.y,radius)) {

      land(drop);

    if (!animate) {

      base = target;
      balanceWater();
      draw();

  }

  function update(dt) {

    gravityY += (gravityTargetY - gravityY) * gravityBlend;
    const angleDelta = Math.atan2(Math.sin(desiredTilt-tilt),Math.cos(desiredTilt-tilt));
    const tiltAcceleration = 64 * angleDelta - 16 * tiltVelocity;

    balanceWater();

    const dx = width / (N - 1);
    const waveSpeed = Math.min(210, 90 + Math.sqrt(Math.max(0, height - base)) * 9);
    // Launch small localized pulses using the same impulse as a falling drop.
    // No full-width standing modes: each narrow crest travels on its own.
    const wetPoints=clippedPool(waterOffset).filter(p=>Math.abs(p.x*waterNormal.x+p.y*waterNormal.y-waterOffset)<.1).map(p=>waveX(p.x,p.y));

    for (let i = 0; i < N; i++) {

      const right = displacement[Math.min(N - 1, i + 1)];
      const excess = Math.max(0, Math.abs(displacement[i]) - Math.min(32, height * .035));
      const force = -5 * displacement[i] + (waveSpeed / dx) ** 2 * (left + right - 2 * displacement[i])

          drop.merge += dt;

  function draw(delta=0) {

  function frame(now) {
    if (!document.hidden) {

  canvas.addEventListener('click', event => {

  canvas.addEventListener('keydown', event => {

    if(sideProgress>0||sideTo>0){backFromSide();return true;}

      recordFrame?.contentWindow.postMessage({channel:'water-editor',action:'dismiss'},'*');
      closeRecordEditor(false);return true;
    }
    if(settingsOpen || settingsProgress>0) {
      if(recordFrame)recordFrame.hidden=true;
      recordFrame?.contentWindow.postMessage({channel:'water-editor',action:'dismiss'},'*');
      if(settingsOpen)closeSettings();
      return true;
    }
    return false;
  };
  document.querySelector('#reset').addEventListener('click', () => {
    count = 0;
    entryAnimation?.cancel();
    entryAnimation = null;
    entry.state = 'water';
    entryDisk.hidden = true;
    stage.classList.remove('entry-open');
    drops = []; impacts = [];
    tiltRippleCooldown = 0;
    displacement.fill(0); velocity.fill(0);
    base = target = level();
    tilt = desiredTilt;
    tiltVelocity = 0;
    balanceWater();
    countLabel.textContent = '0';
    caption.textContent = '滴';
    draw();
  });
  let wakeWaterArmed=false;
  function wakeWater() {
    if(!wakeWaterArmed||document.hidden)return;
    wakeWaterArmed=false;
    if(reducedMotion.matches||entry.state!=='water'||sideProgress>0||settingsProgress>0||loginProgress>0)return;
    // A small, zero-mean impulse tilts the surface briefly without changing volume.
    for(let i=0;i<N;i++)velocity[i]+=14*Math.cos(Math.PI*i/(N-1));
    starCurrent+=3;
    monthAmountMotion=null;
    paintMonthAmount(0);
    monthAmountTarget=monthlySpent;
    beginMonthAmountMotion();
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)wakeWaterArmed=true;else wakeWater();
  });
  addEventListener('waterforeground',event=>{
    if(event.detail?.active===false)wakeWaterArmed=true;else wakeWater();
  });
  addEventListener('resize', resize);
  addEventListener('focus', updateMonthTotal);
  addEventListener('visibilitychange', () => { if (!document.hidden) updateMonthTotal(); });
  updateMonthTotal();
  applyInk(COLOR);
  resize();
  updateStatus();
  enableSensor();
  requestAnimationFrame(frame);
})();
