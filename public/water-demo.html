<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>水滴记</title>
  <style>
    * { box-sizing: border-box; }
    main { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas:focus:not(:focus-visible) { outline: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; color: #000; font-family: system-ui, sans-serif; }
    main { position: fixed; inset: 0; background: #fff; isolation: isolate; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; outline-offset: -6px; }
    :root { --page-heading-size:26px; --page-heading-top:max(76px,calc(env(safe-area-inset-top,0px) + 52px)); }
    header { position: absolute; top: var(--page-heading-top); left: 28px; right: 28px; pointer-events: none; color: var(--water-ink,#000); z-index: 1; }
    #lightHeader { position:absolute; inset:0; z-index:1; pointer-events:none; clip-path:url(#inkClip); }
    #lightHeader header { color:#fff; }
    main.settings-open #lightHeader { visibility:hidden; }
    .month-value { display:block; font:400 var(--page-heading-size)/1.35 system-ui,sans-serif; font-variant-numeric:tabular-nums; }
    .amount-digit { display:inline-block; width:1ch; height:1.35em; overflow:hidden; vertical-align:top; }
    .amount-strip { display:block; will-change:transform; }
    .amount-strip > span { display:block; height:1.35em; line-height:1.35; }
    #inlineCategories details { margin:8px 0; }
    #inlineCategories summary, .inline-category-row { display:flex; align-items:center; gap:8px; min-height:44px; border-bottom:1px solid #ffffff30; }
    #inlineCategories summary { cursor:pointer; }
    #inlineCategories summary span, .inline-category-row span { flex:1; }
    .inline-category-children { padding-left:14px; }
    #inlineCategories button { font-size:20px; }
    .month-label { position:absolute; bottom:calc(100% + 9px); margin:0; font:400 15px/1.35 system-ui,sans-serif; }
    #monthAmount { display:block; font:400 var(--page-heading-size)/1.35 system-ui,sans-serif; font-variant-numeric:tabular-nums; }
    #settingsPage { position: absolute; inset: 0; z-index: 4; color: var(--ink-text,#fff); padding: 40px 28px; transform: translateY(100%); pointer-events: none; visibility: hidden; overflow-y: auto; }
    main.settings-open header { visibility: hidden; }
    main.settings-open #settingsPage { visibility: visible; transform: translateY(0); pointer-events: auto; }
    #settingsBack { padding: 0; width: 44px; text-align: left; font-size: 30px; }
    #settingsPage h2 { margin: 24px 0 28px; font-size: 24px; font-weight: 400; }
    .settings-section { margin: 0 0 26px; }
    .settings-section h3 { font-size: 15px; font-weight: 400; margin: 0 0 14px; }
    #openCategories { border: 1px solid #777; border-radius: 10px; width: 100%; text-align: left; padding: 14px; font-size: 15px; }
    #inkOptions { display: flex; flex-wrap: wrap; gap: 14px; }
    #inkOptions button { width: 36px; height: 36px; min-height: 36px; border-radius: 50%; border: 2px solid #aaa; padding: 0; }
    #inkOptions button[aria-checked="true"] { outline: 2px solid var(--ink-text,#fff); outline-offset: 4px; }
    #monthlyQuota { color: var(--ink-text,#fff) !important; }
    #recordFrame { z-index: 5 !important; }
    #settingsPage label { display: block; font-size: 14px; color: #999; }
    .quota-input { display: flex; align-items: center; gap: 12px; margin: 18px 0 26px; border-bottom: 1px solid #444; padding-bottom: 12px; font-size: 32px; }
    #monthlyQuota { width: 100%; min-width: 0; background: none; border: 0; outline: none; color: #fff; font: 300 40px system-ui; }
    #saveQuota { border: 1px solid #555; border-radius: 24px; padding: 10px 28px; font-size: 15px; }
    #quotaStatus { font-size: 13px; color: #aaa; min-height: 20px; }
    #loginPage { position:absolute; inset:0; z-index:4; padding:36px 28px; color:var(--water-ink,#000); background:#fff; transform:translateY(-100%); visibility:hidden; pointer-events:none; overflow-y:auto; }
    main.login-open #loginPage { visibility:visible; pointer-events:auto; }
    main > header, #lightHeader { opacity:1; }
    #loginBack { font-size:30px; padding:0; width:44px; text-align:left; }
    #loginPage h2 { margin:26px 0 32px; font-size:26px; font-weight:400; }
    #loginForm { display:grid; gap:22px; max-width:420px; }
    #loginForm label { display:grid; gap:10px; font-size:14px; }
    #loginForm input { width:100%; box-sizing:border-box; min-height:44px; border:0; border-bottom:1px solid #bbb; border-radius:0; background:transparent; color:inherit; font:18px system-ui; outline-offset:4px; }
    #loginForm details { font-size:13px; color:#777; }
    #loginForm details label { margin-top:18px; }
    #loginSubmit { background:var(--water-ink,#000); color:#fff; border-radius:28px; font-size:16px; }
    #loginSubmit:disabled { opacity:.5; }
    #loginLogout { border:1px solid currentColor; border-radius:28px; font-size:16px; }
    #loginStatus { font-size:14px; min-height:20px; margin:0; line-height:1.5; overflow-wrap:anywhere; }
    @media (max-height: 700px) {
      #settingsPage { padding: 24px; }
      #settingsPage h2 { margin: 12px 0 20px; }
      .settings-section { margin-bottom: 18px; }
      .quota-input { margin: 12px 0 18px; padding-bottom: 8px; }
      #monthlyQuota { font-size: 32px; }
    }
    #settingsPage, #loginPage { padding-bottom:calc(40px + var(--keyboard-gap,0px)); overscroll-behavior:contain; }
    #settingsPage, #loginPage { padding-top:var(--page-heading-top); padding-left:28px; padding-right:28px; }
    #settingsPage h2, #loginPage h2 { margin:0 0 28px; font:400 var(--page-heading-size)/1.35 system-ui,sans-serif; }
    #settingsBack, #loginBack { position:absolute; top:calc(var(--page-heading-top) - 56px); left:28px; }
    #settingsPage input, #loginPage input { scroll-margin-block:24px; }
    #sideDisk { position:absolute; width:100px; height:100px; border-radius:50%; background:#000; z-index:3; pointer-events:none; transform-origin:center; will-change:transform; }
    #sideDiskFill { position:absolute; inset:0; border-radius:50%; background:#fff; transform-origin:center; }
    #sidePage { position:absolute; left:0; top:0; width:0; height:0; z-index:4; color:#000; visibility:hidden; touch-action:none; border-radius:50%; overflow:hidden; isolation:isolate; transform-origin:center; will-change:transform; }
    #sideViewport { position:absolute; width:100vw; height:100vh; background:#fff; transform-origin:0 0; will-change:transform; }
    #sideBack { font-size:30px; padding:0; width:44px; text-align:left; }
    #sideBack { position:absolute; top:20px; left:24px; z-index:2; }
    #sideFrame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; visibility:hidden; }
    #sidePage h2 { margin:26px 0 14px; font-size:26px; font-weight:400; }
    #sidePage p { font-size:14px; opacity:.55; }
    h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: .2em; }
    header > div { display: flex; flex-wrap: wrap; justify-content: flex-end; }
    header { gap: 12px; }
    h1 { flex-shrink: 0; }
    button { pointer-events: auto; border: 0; background: transparent; padding: 12px; min-height: 44px; color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
    .hint { position: absolute; top: 24%; width: 100%; text-align: center; pointer-events: none; }
    .hint p { margin: 0 0 10px; font-size: 15px; letter-spacing: .12em; }
    .hint small { font-size: 11px; color: #666; letter-spacing: .08em; }
    footer { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); width: 100%; text-align: center; pointer-events: none; font-size: 11px; letter-spacing: .15em; color: #fff; mix-blend-mode: difference; }
    #count { font-size: 24px; display: block; margin-bottom: 6px; font-variant-numeric: tabular-nums; font-weight: 400; }
    main.entry-open .hint, main.entry-open footer { visibility: hidden; pointer-events: none; }
    #entryDisk { position: absolute; border-radius: 50%; background: #000; pointer-events: none; transform-origin: center; will-change: transform; z-index: 2; }
    #entryDisk[hidden] { display: none; }
    #recordFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 3; background: #000; }
    #recordFrame[hidden] { display: block; visibility: hidden; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <canvas id="water" tabindex="0" role="button" aria-label="记一笔消费"></canvas>
    <div id="entryDisk" hidden aria-hidden="true"></div>
    <iframe id="recordFrame" name="water-record-preview" title="记账" hidden></iframe>
    <header aria-label="本月支出"><p class="month-label">本月支出</p><span id="monthAmount">¥0.00</span></header>
    <svg width="0" height="0" aria-hidden="true"><defs><clipPath id="inkClip" clipPathUnits="userSpaceOnUse"><path id="waterTextClip"/></clipPath></defs></svg>
    <div id="lightHeader" aria-hidden="true"><header><p class="month-label">本月支出</p><span id="lightMonthAmount" class="month-value">¥0.00</span></header></div>
    <section id="settingsPage" aria-label="账户与额度" aria-hidden="true" inert>
      <button id="settingsBack" type="button" aria-label="返回">‹</button>
      <h2>设置</h2>
      <div class="settings-section"><h3>分类</h3><div id="inlineCategories"></div><button id="addInlineCategory" type="button" aria-label="添加一级分类">＋</button></div>
      <div class="settings-section"><h3>配色</h3><div id="inkOptions" role="radiogroup" aria-label="水体配色">
        <button type="button" data-ink="#000000" style="background:#000000" role="radio" aria-label="黑色"></button>
        <button type="button" data-ink="#234b40" style="background:#234b40" role="radio" aria-label="墨绿"></button>
        <button type="button" data-ink="#263e68" style="background:#263e68" role="radio" aria-label="深蓝"></button>
        <button type="button" data-ink="#00105C" style="background:#00105C" role="radio" aria-label="藏蓝"></button>
        <button type="button" data-ink="#654058" style="background:#654058" role="radio" aria-label="暗紫"></button>
        <button type="button" data-ink="#854536" style="background:#854536" role="radio" aria-label="赭红"></button>
      </div></div>
      <div class="settings-section"><h3>额度</h3>
      <label for="monthlyQuota">每月总额度</label>
      <div class="quota-input"><span>¥</span><input id="monthlyQuota" type="number" inputmode="decimal" min="0.01" step="0.01" value="8000" aria-label="每月总额度"></div>
      <button id="saveQuota" type="button">保存</button><p id="quotaStatus" role="status"></p></div>
    </section>
    <div id="sideDisk" hidden><div id="sideDiskFill"></div></div>
    <section id="sidePage" aria-label="侧页动画预览" aria-hidden="true" inert>
      <div id="sideViewport">
      <button id="sideBack" aria-label="返回主页">‹</button>
      <iframe id="sideFrame" name="water-page-preview" title="历史记录与统计"></iframe>
      </div>
    </section>
    <section id="loginPage" aria-label="账号登录" aria-hidden="true" inert>
      <button id="loginBack" type="button" aria-label="返回">‹</button><h2>登录</h2>
      <form id="loginForm">
        <label>邮箱<input id="loginEmail" type="email" autocomplete="username" required placeholder="输入邮箱"></label>
        <label>密码<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="输入密码"></label>
        <details id="loginConnection"><summary>连接设置</summary>
          <label>Supabase URL<input id="loginUrl" type="url" placeholder="https://项目.supabase.co" autocomplete="url"></label>
          <label>Supabase Key<input id="loginKey" type="text" placeholder="publishable / anon key" autocapitalize="off" spellcheck="false" autocomplete="off"></label>
        </details>
        <button id="loginSubmit" type="submit">登录</button><button id="loginLogout" type="button" hidden>退出登录</button>
        <button id="loginReconnect" type="button" hidden>重新连接（无需密码）</button>
        <p id="loginStatus" role="status"></p>
        <p id="ledgerStatus" role="status"></p>
        <button id="ledgerRefresh" type="button" hidden>刷新消费记录</button>
      </form>
    </section>
    <div hidden aria-hidden="true"><button id="motion" type="button"></button><button id="tilt" type="button"></button><button id="reset" type="button"></button><span id="status"></span><span id="count"></span><span id="caption"></span></div>
  </main>
  <script id="recordBundle" type="application/json">"﻿\u003c!DOCTYPE html>\r\n\u003chtml lang=\"zh-CN\">\r\n\u003chead>\r\n  \u003cmeta charset=\"UTF-8\">\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n  \u003ctitle>Budget Gauge\u003c/title>\r\n  \r\n  \r\n  \r\n  \r\n\u003cstyle>﻿:root {\r\n  --app-viewport-height: 100vh;\r\n  --app-viewport-unit: calc(var(--app-viewport-height) / 100);\r\n  --keyboard-inset: 0px;\r\n  --bg: #050b14;\r\n  --panel: rgba(10, 18, 33, 0.88);\r\n  --panel-border: rgba(255, 255, 255, 0.08);\r\n  --text: #eef5ff;\r\n  --muted: #98abc5;\r\n  --accent: #69f0c3;\r\n  --blue: #6f9dff;\r\n  --page-bg: #f8fbff;\r\n  --page-text: #303842;\r\n  --page-muted: #8a929c;\r\n  --page-blue: #347ff7;\r\n  --page-cyan: #5de0cf;\r\n  --page-bg-top: #ffffff;\r\n  --page-bg-bottom: #f8fbff;\r\n  --page-title: #343c47;\r\n  --page-accent-rgb: 52, 127, 247;\r\n  --gauge-value-start: #69f0c3;\r\n  --gauge-value-mid: #89f6ff;\r\n  --gauge-value-end: #6f9dff;\r\n  --gauge-reference: rgba(222, 227, 233, 0.84);\r\n  --gauge-tick: rgba(176, 183, 193, 0.36);\r\n  --history-scrollbar-track: rgba(255, 255, 255, 0.08);\r\n  --history-scrollbar-start: rgba(158, 245, 216, 0.95);\r\n  --history-scrollbar-end: rgba(118, 167, 255, 0.95);\r\n  --history-scrollbar-hover-start: rgba(176, 249, 226, 0.98);\r\n  --history-scrollbar-hover-end: rgba(132, 179, 255, 0.98);\r\n  --history-bar-track: rgba(255, 255, 255, 0.06);\r\n  --history-bar-shadow: rgba(105, 240, 195, 0.16);\r\n  --history-muted-text: #6f7d8d;\r\n  --history-subtle-text: #7d8a98;\r\n  --add-btn-start: #59d6ee;\r\n  --add-btn-end: #437cff;\r\n  --add-btn-shadow: rgba(52, 127, 247, 0.28);\r\n}\r\n\r\nbody[data-theme=\"forest\"] {\r\n  --page-bg-top: #fcfcfa;\r\n  --page-bg-bottom: #f8f7f3;\r\n  --page-text: #14342b;\r\n  --page-muted: #7e8581;\r\n  --page-blue: #2f5d4f;\r\n  --page-cyan: #7bb39d;\r\n  --page-title: #14342b;\r\n  --page-accent-rgb: 47, 93, 79;\r\n  --gauge-value-start: #89bea7;\r\n  --gauge-value-mid: #5f9a83;\r\n  --gauge-value-end: #2f5d4f;\r\n  --gauge-reference: rgba(226, 223, 214, 0.92);\r\n  --gauge-tick: rgba(188, 181, 168, 0.42);\r\n  --history-scrollbar-track: rgba(231, 228, 219, 0.72);\r\n  --history-scrollbar-start: rgba(137, 190, 167, 0.96);\r\n  --history-scrollbar-end: rgba(47, 93, 79, 0.96);\r\n  --history-scrollbar-hover-start: rgba(151, 200, 178, 0.98);\r\n  --history-scrollbar-hover-end: rgba(35, 78, 65, 0.98);\r\n  --history-bar-track: rgba(226, 223, 214, 0.66);\r\n  --history-bar-shadow: rgba(47, 93, 79, 0.16);\r\n  --history-muted-text: #4f625b;\r\n  --history-subtle-text: #62736c;\r\n  --add-btn-start: #416f60;\r\n  --add-btn-end: #183f34;\r\n  --add-btn-shadow: rgba(24, 63, 52, 0.28);\r\n}\r\n\r\n* {\r\n  box-sizing: border-box;\r\n}\r\n\r\nhtml,\r\nbody {\r\n  margin: 0;\r\n  width: 100%;\r\n  height: var(--app-viewport-height);\r\n  overflow: hidden;\r\n  overscroll-behavior: none;\r\n}\r\n\r\nbody {\r\n  height: var(--app-viewport-height);\r\n  min-height: 100vh;\r\n  min-height: var(--app-viewport-height);\r\n  position: fixed;\r\n  top: 0;\r\n  left: 0;\r\n  right: 0;\r\n  bottom: auto;\r\n  display: grid;\r\n  place-items: center;\r\n  font-family: \"Space Grotesk\", sans-serif;\r\n  color: var(--text);\r\n  touch-action: manipulation;\r\n  background:\r\n    radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.96), transparent 28%),\r\n    linear-gradient(180deg, var(--page-bg-top) 0%, var(--page-bg-bottom) 100%);\r\n}\r\n\r\nbody *:not(a):not(input):not(textarea):not(select):not(option):not([contenteditable=\"true\"]) {\r\n  -webkit-user-select: none;\r\n  user-select: none;\r\n  -webkit-touch-callout: none;\r\n  -webkit-tap-highlight-color: transparent;\r\n}\r\n\r\na,\r\ninput,\r\ntextarea,\r\nselect,\r\noption,\r\n[contenteditable=\"true\"] {\r\n  -webkit-user-select: auto;\r\n  user-select: auto;\r\n}\r\n\r\n.gauge-page {\r\n  --record-ring-top-boundary: calc(176px + env(safe-area-in       const poolDepth = Math.max(0, height - base);
      const depth = Math.min(r * 2.35, poolDepth * .80);
      // A widening cavity displaces water into two shoulders, then collapses.
      const cavity = Math.sin(Math.PI * Math.min(1, t / .32)) ** 2;
      const spread = r * (1.1 + t * 3);
      const d = (x - hit.x) / spread;
      offset += depth * cavity * (gaussian(d) - .5 * gaussian(d / 2));
      // A low, broad mound settles back into the travelling waves.
      const phase = (t - .22) / .34;
      if (phase > 0 && phase < 1) {
        const envelope = Math.sin(Math.PI * phase) ** 2;
        const moundWidth = r * (1.4 + .5 * phase);
        offset -= r * .55 * envelope * gaussian((x - hit.x) / moundWidth);
      }
    }
    // Bound overlapping impacts so rapid taps cannot throw the pool off screen.
    const limit = Math.min(60, height * .12);
    return limit * Math.tanh(offset / limit);
  }

  function waveOffset(x) {
    const p = Math.max(0, Math.min(N - 1, x / width * (N - 1)));
    const i = Math.floor(p);
    return displacement[i] * (1 - (p - i)) + displacement[Math.min(N - 1, i + 1)] * (p - i) + localSurface(x);
  }
  function waveX(x,y) { return clamp((x*waterNormal.y-y*waterNormal.x-tangentMin)/(tangentMax-tangentMin)*width,0,width); }
  function touchesWater(x,y,radius=0) { return x*waterNormal.x+y*waterNormal.y+radius >= waterOffset+waveOffset(waveX(x,y)); }
  function surface(x) {
    const ny=Math.abs(waterNormal.y)<.0001 ? .0001 : waterNormal.y;
    const y=(waterOffset-x*waterNormal.x)/ny;
    return clamp(y+waveOffset(waveX(x,y))/ny,0,height);
  }

  function impact(x, strength, radius = 10) {
    for (let i = 0; i < N; i++) {
      const distance = (i * width / (N - 1) - x) / (radius * 1.7);
      velocity[i] += strength * (gaussian(distance) - .5 * gaussian(distance / 2));
    }
  }

  function land(drop) {
    if(!drop.cosmetic){
      count++;
      target = level();
      countLabel.textContent = count;
      if (count === maxDrops) caption.textContent = '水满了 · 重新开始，再积一池';
    }
    if (!animate) return;
    const hitX=waveX(drop.x,drop.y);
    impact(hitX, Math.min(275, Math.hypot(drop.vx, drop.vy) * .40), drop.radius);
    impacts.push({ x: hitX, worldX:drop.x, worldY:drop.y, age: 0, radius: drop.radius });
  }

  function addDrop(x = width / 2, y = height / 2, released = false, cosmetic = false) {
    if (!cosmetic && !hasRecordEditor && count + drops.filter(d => !d.landed).length >= maxDrops) return;
    const radius = cosmetic ? 10 : dropRadius();
    const drop = { x: clamp(x, radius, width - radius), y: clamp(y, radius, height - radius), vx: 0, vy: 0, age: released ? .12 : 0, radius, cosmetic };
    // Touching existing water makes a ripple there instead of an invisible bead.
    if (touchesWater(drop.x,drop.y,radius)) {
      drop.vy = 240;
      land(drop);
      return;
    }
    if (!animate) {
      land(drop);
      base = target;
      balanceWater();
      draw();
    } else drops.push(drop);
  }

  function update(dt) {
    base += (target - base) * (1 - Math.exp(-dt * 3));
    const gravityBlend = 1 - Math.exp(-dt * 20);
    gravityX += (gravityTargetX - gravityX) * gravityBlend;
    gravityY += (gravityTargetY - gravityY) * gravityBlend;
    const angleDelta = Math.atan2(Math.sin(desiredTilt-tilt),Math.cos(desiredTilt-tilt));
    const tiltAcceleration = 64 * angleDelta - 16 * tiltVelocity;
    if (animate) {
      tiltVelocity += tiltAcceleration * dt;
      tilt += tiltVelocity * dt;
    } else {
      tilt += angleDelta * (1 - Math.exp(-dt * 5));
      tiltVelocity = 0;
    }
    balanceWater();
    // Spatially scaled wave equation: propagation speed stays stable on resize.
    const dx = width / (N - 1);
    const waveSpeed = Math.min(210, 90 + Math.sqrt(Math.max(0, height - base)) * 9);
    // Launch small localized pulses using the same impulse as a falling drop.
    // No full-width standing modes: each narrow crest travels on its own.
    const wetPoints=clippedPool(waterOffset).filter(p=>Math.abs(p.x*waterNormal.x+p.y*waterNormal.y-waterOffset)<.1).map(p=>waveX(p.x,p.y));
    const wetLeft = wetPoints.length ? Math.min(...wetPoints) : 0;
    const wetRight = wetPoints.length ? Math.max(...wetPoints) : 0;
    const wetWidth = wetRight - wetLeft;
    tiltRippleCooldown = Math.max(0, tiltRippleCooldown - dt);
    const flowSpeed = Math.abs(tiltVelocity);
    if (animate && flowSpeed > .075 && tiltRippleCooldown === 0 && wetWidth > 48) {
      const radius = clamp(width * .017, 5.5, 8);
      const inset = Math.min(wetWidth * .25, radius * 4);
      const source = tiltVelocity < 0 ? wetRight - inset : wetLeft + inset;
      impact(source, clamp(75 + flowSpeed * 65, 80, 175), radius);
      tiltRippleCooldown = .16;
    }
    for (let i = 0; i < N; i++) {
      const left = displacement[Math.max(0, i - 1)];
      const right = displacement[Math.min(N - 1, i + 1)];
      const excess = Math.max(0, Math.abs(displacement[i]) - Math.min(32, height * .035));
      const force = -5 * displacement[i] + (waveSpeed / dx) ** 2 * (left + right - 2 * displacement[i])
        - Math.sign(displacement[i]) * excess * 22;
      velocity[i] = (velocity[i] + force * dt) * Math.exp(-1.05 * dt);
    }
    for (let i = 0; i < N; i++) displacement[i] += velocity[i] * dt;
    impacts = impacts.filter(hit => {
      hit.age += dt;
      return hit.age < .65;
    });
    drops = drops.filter(drop => {
      drop.age += dt;
      if (drop.wall) {
        drop.wallAge += dt;
        const waterY = surface(drop.x);
        if (drop.landed) {
          // The film stays connected to the pool while its tail drains away.
          drop.merge += dt;
          drop.wallFront = waterY + 2;
          drop.wallTail += (waterY + 2 - drop.wallTail) * (1 - Math.exp(-24 * dt));
          return drop.merge < .22;
        }
        // A wall contact spreads into a thin attached film, not a bouncing ball.
        const direction=gravityY>=0?1:-1;
        drop.vy = clamp(drop.vy + gravity() * gravityY * dt * .65,-850,850);
        drop.wallFront += drop.vy * dt;
        const filmLength = drop.radius * (2 + 16 * (1 - Math.exp(-drop.wallAge * 8)));
        drop.wallTail = direction>0 ? Math.max(drop.wallTail, drop.wallFront-filmLength) : Math.min(drop.wallTail,drop.wallFront+filmLength);
        drop.y=drop.wallFront;
        if (touchesWater(drop.x,drop.wallFront,2)) {
          drop.wallFront = waterY + direction*2;
          drop.landed = true;
          drop.merge = 0;
          land(drop);
        }
        return true;
      }
      if (drop.landed) {
        drop.merge += dt;
        drop.x += drop.vx * dt * .35;
        drop.y += drop.vy * dt * .35;
        return drop.merge < .07;
      }
      // A short appearance at the center makes the circular bead easy to see.
      if (drop.age > .12) {
        drop.vx += gravity() * gravityX * dt;
        drop.vy += gravity() * gravityY * dt;
        drop.x += drop.vx * dt;
        drop.y += drop.vy * dt;
        // A bead meeting a dry wall becomes a visible film and still has to
        // travel to the actual water surface before it contributes to the pool.
        if (drop.x < drop.radius || drop.x > width - drop.radius) {
          drop.wall = drop.x < drop.radius ? -1 : 1;
          drop.x = drop.wall < 0 ? 0 : width;
          drop.wallAge = 0;
          const direction=gravityY>=0?1:-1;
          drop.wallTail = clamp(drop.y - direction*drop.radius,0,height);
          drop.wallFront = drop.y + direction*drop.radius;
          drop.vy = direction*Math.max(35,Math.abs(drop.vy)*.55);
          drop.vx = 0;
          if (touchesWater(drop.x,drop.wallFront,2)) {
            drop.landed = true;
            drop.merge = 0;
            land(drop);
          }
          return true;
        }
        if (drop.y < drop.radius) {
          drop.y = drop.radius;
          drop.vy = Math.abs(drop.vy) * .12;
        }
      }
      if (touchesWater(drop.x,drop.y,drop.radius)) {
        drop.landed = true;
        drop.merge = 0;
        land(drop);
      }
      return true;
    });
  }

  function draw(delta=0) {
    ctx.clearRect(0, 0, width, height);
    ctx.save();ctx.translate(0,height*loginProgress);
    ctx.fillStyle = COLOR;
    ctx.beginPath();
    const n=waterNormal,fill=settingsProgress,far=Math.hypot(width,height)*2;
    const minProjection=Math.min(0,width*n.x,height*n.y,width*n.x+height*n.y);
    const offset=waterOffset+(minProjection-waterOffset)*fill;
    const point=(u,v)=>({x:u*n.y+v*n.x,y:-u*n.x+v*n.y});
    let p=point(tangentMin,offset+far);ctx.moveTo(p.x,p.y);
    const clipPoints=[p];
    const samples=Math.ceil((tangentMax-tangentMin)/2);
    for(let i=0;i<=samples;i++) {
      p=point(tangentMin+(tangentMax-tangentMin)*i/samples,offset+waveOffset(width*i/samples)*(1-fill));
      ctx.lineTo(p.x,p.y);
      clipPoints.push(p);
    }
    p=point(tangentMax,offset+far);ctx.lineTo(p.x,p.y);
    clipPoints.push(p);
    document.querySelector('#waterTextClip')?.setAttribute('d',clipPoints.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+(p.y+height*loginProgress).toFixed(1)).join(' ')+'Z');
    ctx.closePath();
    ctx.fill();
    ctx.save();ctx.clip();drawWaterStars(delta);ctx.restore();
    ctx.fillStyle = COLOR;
    for (const drop of drops) {
      ctx.fillStyle=drop.cosmetic?'#fff':COLOR;
      ctx.strokeStyle='#000';ctx.lineWidth=1.5;
      if (drop.wall) {
        const edge = drop.x;
        const inward = -drop.wall;
        const top = Math.min(drop.wallTail,drop.wallFront);
        const bottom = Math.max(drop.wallTail,drop.wallFront);
        const length = Math.max(1, bottom - top);
        // Flatten quickly against the wall; keep a long, thin trailing film.
        const widthLimit = 2.2 + 2.8 * Math.exp(-drop.wallAge * 25);
        const filmWidth = Math.min(widthLimit, Math.PI * drop.radius ** 2 / (length * .72));
        const thickness = filmWidth * (drop.landed ? Math.exp(-drop.merge * 12) : 1);
        ctx.beginPath();
        ctx.moveTo(edge, top);
        ctx.bezierCurveTo(edge + inward * thickness * .2, top,
          edge + inward * thickness * .5, top + length * .2,
          edge + inward * thickness, top + length * .55);
        ctx.bezierCurveTo(edge + inward * thickness * .8, top + length * .8,
          edge + inward * thickness * .35, bottom - length * .06,
          edge, bottom);
        ctx.closePath();
        ctx.fill();
        if(drop.cosmetic)ctx.stroke();
        continue;
      }
      ctx.beginPath();
      const radius = drop.radius * Math.min(1, drop.age / .1) * (drop.cosmetic&&drop.landed?Math.max(0,1-drop.merge/.07):1);
      const speed = Math.hypot(drop.vx, drop.vy);
      const stretch = 1 + .14 * Math.min(1, speed / 700);
      const angle = speed > 1 ? Math.atan2(drop.vy, drop.vx) - Math.PI / 2 : 0;
      ctx.ellipse(drop.x, drop.y, radius / Math.sqrt(stretch), radius * stretch, angle, 0, Math.PI * 2);
      ctx.fill();
      if(drop.cosmetic)ctx.stroke();
    }
    ctx.restore();
  }

  function frame(now) {
    if (!document.hidden) {
      const delta = Math.min((now - (last || now)) / 1000, .05);
      if(!sideDrag?.locked){sideElapsed=Math.min(.42,sideElapsed+delta);sideProgress=sideFrom+(sideTo-sideFrom)*transitionEase(sideElapsed/.42);}
      if(sidePage){
        if(sideProgress===1){
          openSideContent();
          if(sidePrepared&&!sideEntered){sideEntered=true;sideFrame.contentWindow.postMessage({channel:'water-editor',action:'browse-entered'},'*');}
        }
        const cover=Math.hypot(Math.max(sideX,width-sideX),Math.max(sideY,height-sideY))+3;
        const radius=cover*sideProgress;
        // Keep both the clipping window and iframe layout size fixed. Resizing
        // a rounded ancestor every frame can invalidate Android iframe tiles.
        // Reciprocal compositor transforms reveal the page at its original size.
        const innerRadius=Math.max(0,radius-1.5);
        const revealScale=Math.max(.0001,innerRadius/cover);
        sidePage.style.width=sidePage.style.height=(cover*2)+'px';
        sidePage.style.left=(sideX-cover)+'px';
        sidePage.style.top=(sideY-cover)+'px';
        sidePage.style.transform=`scale(${revealScale})`;
        if(sideViewport){
          sideViewport.style.left=sideViewport.style.top=cover+'px';
          sideViewport.style.width=width+'px';sideViewport.style.height=height+'px';
          sideViewport.style.transform=`scale(${1/revealScale}) translate(${-sideX}px,${-sideY}px)`;
        }
        if(sideDisk){sideDisk.style.width=sideDisk.style.height=(cover*2)+'px';sideDisk.style.left=(sideX-cover)+'px';sideDisk.style.top=(sideY-cover)+'px';sideDisk.style.transform=`scale(${radius/cover})`;}
        if(sideDiskFill)sideDiskFill.style.transform=`scale(${radius>0?Math.max(0,1-1.5/radius):0})`;
        if(sideProgress===0&&!sideDrag?.locked){
          sidePage.style.visibility='hidden';sidePage.inert=true;sidePage.setAttribute('aria-hidden','true');if(sideDisk)sideDisk.hidden=true;
        }
      }
      if(!(verticalDrag?.locked&&verticalDrag.page==='settings')) {
        settingsElapsed=Math.min(.56,settingsElapsed+delta);
        settingsProgress=settingsFrom+(settingsTo-settingsFrom)*transitionEase(settingsElapsed/.56);
      }
      if(settingsPage)settingsPage.style.transform=`translateY(${(1-settingsProgress)*100}%)`;
      if (!settingsOpen && settingsProgress === 0 && settingsPage) settingsPage.style.visibility = 'hidden';
      if(!(verticalDrag?.locked&&verticalDrag.page==='login')) {
        loginElapsed=Math.min(.56,loginElapsed+delta);
        loginProgress=loginFrom+(loginTo-loginFrom)*transitionEase(loginElapsed/.56);
      }
      if(loginPage) {
        loginPage.style.transform=`translateY(${(loginProgress-1)*100}%)`;
        if(!loginOpen&&loginProgress===0){loginPage.style.visibility='hidden';stage.classList.remove('login-open');}
      }
      // Keep gravity, waves and existing drops alive independently of the entry layer.
      accumulator += delta;
      while (accumulator >= STEP) { update(STEP); accumulator -= STEP; }
      if (entry.state !== 'black') draw(delta);
      if (entry.state === 'expanding' || entry.state === 'shrinking') updateEntry(delta);
      tickMonthAmount(delta);
    }
    last = now;
    requestAnimationFrame(frame);
  }
  canvas.addEventListener('click', event => {
    if (suppressClick) { suppressClick = false; return; }
    if (sideProgress>0 || sideDrag?.locked || settingsOpen || settingsProgress > 0 || loginOpen || loginProgress>0) return;
    if (!sensorEnabled) enableSensor(true);
    if (!event || event.detail === 0) { tapScreen(); return; }
    const rect = canvas.getBoundingClientRect();
    tapScreen((event.clientX - rect.left) * width / rect.width,
      (event.clientY - rect.top) * height / rect.height);
  });
  canvas.addEventListener('keydown', event => {
    if(sideProgress>0)return;
    if (settingsOpen || settingsProgress > 0 || loginOpen || loginProgress>0) return;
    if(entry.state==='water'&&(event.code==='ArrowLeft'||event.code==='ArrowRight')){event.preventDefault();showSide(event.code==='ArrowLeft'?1:-1);settleSide(1);return;}
    if(event.code==='ArrowDown'){event.preventDefault();openLogin();return;}
    if (event.code === 'ArrowUp') { event.preventDefault(); openSettings(); return; }
    if (event.code === 'Space' || event.code === 'Enter') {
      event.preventDefault();
      if (!event.repeat) tapScreen();
    }
  });
  canvas.addEventListener('pointerdown', event => {
    suppressClick=false;
    beginVertical(event,event);
    beginSide(event);
  });
  canvas.addEventListener('pointermove',event=>{if(!moveVertical(event,event))moveSide(event);});
  canvas.addEventListener('pointerup',event=>{if(!endVertical(false,event))endSide();});
  canvas.addEventListener('pointercancel',()=>{endVertical(true);endSide(true);});
  window.waterBack = () => {
    if(sideProgress>0||sideTo>0){backFromSide();return true;}
    if(loginOpen||loginProgress>0){if(loginOpen)closeLogin();return true;}
    if(entry.state==='shrinking')return true;
    if(entry.state==='expanding'){returnAfterExpand=true;return true;}
    if(entry.state==='black') {
      recordFrame?.contentWindow.postMessage({channel:'water-editor',action:'dismiss'},'*');
      closeRecordEditor(false);return true;
    }
    if(settingsOpen || settingsProgress>0) {
      if(recordFrame)recordFrame.hidden=true;
      recordFrame?.contentWindow.postMessage({channel:'water-editor',action:'dismiss'},'*');
      if(settingsOpen)closeSettings();
      return true;
    }
    return false;
  };
  document.querySelector('#reset').addEventListener('click', () => {
    count = 0;
    entryAnimation?.cancel();
    entryAnimation = null;
    entry.state = 'water';
    entryDisk.hidden = true;
    stage.classList.remove('entry-open');
    drops = []; impacts = [];
    tiltRippleCooldown = 0;
    displacement.fill(0); velocity.fill(0);
    base = target = level();
    tilt = desiredTilt;
    tiltVelocity = 0;
    balanceWater();
    countLabel.textContent = '0';
    caption.textContent = '滴';
    draw();
  });
  addEventListener('resize', resize);
  addEventListener('focus', updateMonthTotal);
  addEventListener('visibilitychange', () => { if (!document.hidden) updateMonthTotal(); });
  updateMonthTotal();
  applyInk(COLOR);
  resize();
  updateStatus();
  enableSensor();
  requestAnimationFrame(frame);
})();

  </script>
</body>
</html>
