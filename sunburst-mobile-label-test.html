<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunburst Label Test</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #chart {
      width: min(94vw, 520px);
      height: min(94vw, 520px);
    }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js"></script>
  <script>
    const chart = echarts.init(document.getElementById("chart"));

    const data = [
      {
        name: "餐饮",
        value: 520,
        children: [
          { name: "早餐", value: 80 },
          { name: "午餐", value: 180, children: [
            { name: "火锅", value: 90 },
            { name: "小吃", value: 50 },
            { name: "饮料", value: 40 },
          ] },
          { name: "晚餐", value: 210 },
          { name: "零食", value: 50 },
        ],
      },
      {
        name: "购物",
        value: 360,
        children: [
          { name: "衣物", value: 160 },
          { name: "日用品", value: 90 },
          { name: "数码", value: 110 },
        ],
      },
      {
        name: "住房",
        value: 280,
        children: [
          { name: "房租", value: 180 },
          { name: "水电", value: 60 },
          { name: "网络", value: 40 },
        ],
      },
      {
        name: "娱乐",
        value: 210,
        children: [
          { name: "电影", value: 70 },
          { name: "游戏", value: 80 },
          { name: "会员", value: 60 },
        ],
      },
    ];

    chart.setOption({
      series: [
        {
          type: "sunburst",
          data,
          radius: ["18%", "92%"],
          nodeClick: "rootToNode",
          label: {
            rotate: 0,
            fontSize: 13,
          },
          levels: [
            {},
            {
              r0: "18%",
              r: "48%",
              label: {
                fontSize: 16,
                fontWeight: "bold",
              },
            },
            {
              r0: "48%",
              r: "70%",
            },
            {
              r0: "70%",
              r: "92%",
            },
          ],
        },
      ],
    });

    window.addEventListener("resize", () => chart.resize());
  </script>
</body>
</html>
