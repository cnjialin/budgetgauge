<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Gauge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="gauge-page">
    <button id="openSettingsBtn" class="top-menu-btn" type="button" aria-haspopup="dialog" aria-controls="releaseInfoModal" aria-expanded="false" aria-label="打开版本信息">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <header class="gauge-head">
      <div class="home-head-content">
        <p class="gauge-kicker">Budget Cluster</p>
        <p id="connectionStatus" class="connection-status">登录中</p>
      </div>
      <div class="record-head-content" aria-label="记录消费输入">
        <label class="record-amount-field">
          <span class="record-amount-spacer" aria-hidden="true"></span>
          <span class="record-amount-label">消费记录</span>
          <span class="record-amount-prefix" aria-hidden="true">¥</span>
          <input id="expenseAmountInput" type="number" inputmode="decimal" enterkeyhint="done" min="0" step="0.01" placeholder="0.00">
          <button id="clearExpenseAmountBtn" class="record-clear-btn" type="button" aria-label="清空金额">
            <span aria-hidden="true"></span>
          </button>
        </label>
        <label class="record-time-field">
          <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
            <path d="M5.5 7.5h13v9.2h-8.2L6.8 19v-2.3H5.5Z"></path>
            <path d="M8.5 10.5h7"></path>
          </svg>
          <span class="record-time-label">消费时间</span>
          <button id="expenseDateTimeTrigger" class="expense-datetime-trigger" type="button">选择消费时间</button>
        </label>
        <label class="record-category-field">
          <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
            <path d="M4.8 7.2h6v6h-6Z"></path>
            <path d="M13.2 7.2h6v6h-6Z"></path>
            <path d="M4.8 15.6h6"></path>
            <path d="M13.2 15.6h6"></path>
          </svg>
          <span class="record-category-label">消费分类</span>
          <input id="expensePurposeInput" type="text" maxlength="30" placeholder="选择或输入分类">
        </label>
      </div>
    </header>

    <section class="gauge-orb" aria-labelledby="gaugeTitle">
      <div class="gauge-stage">
        <div class="home-gauge-content">
          <svg id="budgetGauge" class="budget-gauge" viewBox="0 0 420 420" aria-label="额度仪表盘" role="img">
            <defs>
              <linearGradient id="trackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#19273f"></stop>
                <stop offset="100%" stop-color="#0a1221"></stop>
              </linearGradient>
              <linearGradient id="valueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="var(--gauge-value-start)"></stop>
                <stop offset="55%" stop-color="var(--gauge-value-mid)"></stop>
                <stop offset="100%" stop-color="var(--gauge-value-end)"></stop>
              </linearGradient>
              <linearGradient id="warningGradient" x1="100%" y1="0%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#ffb36b"></stop>
                <stop offset="58%" stop-color="#ff7d88"></stop>
                <stop offset="82%" stop-color="#ff475f"></stop>
                <stop offset="100%" stop-color="#ff243e"></stop>
              </linearGradient>
            </defs>
            <path id="gaugeReferencePath" class="gauge-reference"></path>
            <path id="gaugeValuePath" class="gauge-value"></path>
            <g id="gaugeTicks" class="gauge-ticks"></g>
            <line id="gaugeBudgetMarker" class="gauge-budget-marker"></line>
          </svg>

          <div class="gauge-center" aria-live="polite">
            <p class="center-label">当前剩余</p>
            <strong id="remainingBudget">¥0.00</strong>
            <label class="quick-expense-field" aria-label="消费金额">
              <span aria-hidden="true">¥</span>
              <input id="quickExpenseAmountInput" type="number" inputmode="decimal" enterkeyhint="next" min="0" step="0.01" placeholder="0.00">
            </label>
            <span id="usageText">已使用 0%</span>
          </div>
        </div>

        <div class="record-gauge-content" aria-label="选择消费分类">
          <div id="purposeOptions" class="category-wheel" role="listbox" aria-label="消费分类">
            <div id="categoryDividers" class="category-dividers" aria-hidden="true"></div>
            <div id="categoryOptions" class="category-options"></div>
            <button id="categoryBackBtn" class="category-wheel-center" type="button" aria-label="返回上一级分类">
              <svg class="category-center-icon default" viewBox="0 0 24 24" role="presentation" aria-hidden="true">
                <path d="M6.5 7.2h11v8.2h-5L9 18.2v-2.8H6.5Z"></path>
                <path d="M9 10h6"></path>
                <path d="M9 12.6h4.5"></path>
              </svg>
              <svg class="category-center-icon back" viewBox="0 0 24 24" role="presentation" aria-hidden="true">
                <path d="M8.2 8.4H4.8V5"></path>
                <path d="M5.2 8.1a7.2 7.2 0 1 1-1 5.8"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <button id="openExpenseModalBtn" class="add-expense-btn" type="button" aria-label="记录一笔消费">
      <span aria-hidden="true"></span>
    </button>
    <div class="record-action-dock" aria-label="记录操作">
      <button id="cancelExpenseBtn" class="expense-round-btn cancel" type="button" aria-label="取消">
        <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
          <path d="M6.5 6.5 17.5 17.5"></path>
          <path d="M17.5 6.5 6.5 17.5"></path>
        </svg>
      </button>
      <button id="confirmExpenseBtn" class="expense-round-btn confirm" type="button" aria-label="记录">
        <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
          <path d="M5.5 12.6 9.8 16.9 18.8 7.6"></path>
        </svg>
      </button>
    </div>
    <p id="expenseStatus" class="record-status" aria-live="polite"></p>

    <nav class="bottom-nav" aria-label="主导航">
      <button id="openHistoryBtn" class="bottom-nav-btn" type="button" aria-controls="historyModal" aria-label="查看历史消费">
        <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
          <path d="M6 20V9.5"></path>
          <path d="M12 20V4"></path>
          <path d="M18 20v-7.5"></path>
        </svg>
      </button>

      <button id="homeTabBtn" class="bottom-nav-btn active" type="button" aria-label="首页" aria-current="page">
        <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
          <path d="M4 10.7 12 4l8 6.7v8.1a1.2 1.2 0 0 1-1.2 1.2h-4.3v-5.6h-5V20H5.2A1.2 1.2 0 0 1 4 18.8Z"></path>
        </svg>
        <span></span>
      </button>

      <button id="openStatsBtn" class="bottom-nav-btn" type="button" aria-controls="statsModal" aria-label="查看消费统计">
        <svg viewBox="0 0 24 24" fill="none" role="presentation" aria-hidden="true">
          <path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"></path>
          <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
        </svg>
      </button>

      <button id="openSunburstTestBtn" class="bottom-nav-btn" type="button" aria-controls="sunburstTestModal" aria-label="查看旭日图测试">
        <svg viewBox="0 0 24 24" fill="none" role="presentation" aria-hidden="true">
          <circle cx="12" cy="12" r="8"></circle>
          <path d="M12 4v8l6.9 4"></path>
          <path d="M12 12 5.1 16"></path>
        </svg>
      </button>

      <button id="bottomSettingsBtn" class="bottom-nav-btn" type="button" aria-controls="settingsModal" aria-label="打开设置" hidden>
        <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </nav>
  </main>

  <div id="dateTimePickerModal" class="datetime-picker-modal" hidden>
        <div class="datetime-picker-card" role="dialog" aria-modal="true" aria-label="选择消费时间">
          <div class="datetime-picker-panels">
            <section class="datetime-date-panel" aria-label="选择日期">
              <div class="datetime-picker-toolbar">
                <button id="pickerPrevMonthBtn" class="calendar-nav-btn" type="button" aria-label="上一个月">‹</button>
                <strong id="pickerMonthLabel" class="picker-month-label">2026年4月</strong>
                <button id="pickerNextMonthBtn" class="calendar-nav-btn" type="button" aria-label="下一个月">›</button>
              </div>
              <div class="calendar-weekdays" aria-hidden="true">
                <span>日</span>
                <span>一</span>
                <span>二</span>
                <span>三</span>
                <span>四</span>
                <span>五</span>
                <span>六</span>
              </div>
              <div id="pickerCalendarGrid" class="calendar-grid" role="grid" aria-label="选择日期"></div>
            </section>
            <section class="datetime-time-panel" aria-label="选择时间">
              <div class="datetime-picker-grid">
                <div class="time-wheel-picker" aria-label="选择时间">
                  <div class="time-wheel-column">
                    <span>时</span>
                    <div class="time-wheel-shell">
                      <div id="pickerHourWheel" class="time-wheel-list"></div>
                    </div>
                  </div>
                  <div class="time-wheel-column">
                    <span>分</span>
                    <div class="time-wheel-shell">
                      <div id="pickerMinuteWheel" class="time-wheel-list"></div>
                    </div>
                  </div>
                  <div class="time-wheel-column">
                    <span>秒</span>
                    <div class="time-wheel-shell">
                      <div id="pickerSecondWheel" class="time-wheel-list"></div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
          <div class="datetime-picker-actions">
            <button id="dateTimeNowBtn" class="expense-btn ghost" type="button">现在</button>
            <button id="dateTimeCancelBtn" class="expense-btn ghost" type="button">取消</button>
            <button id="dateTimeConfirmBtn" class="expense-btn primary" type="button">确定</button>
          </div>
        </div>
  </div>

  <div id="settingsModal" class="settings-modal" hidden>
    <div id="settingsBackdrop" class="expense-backdrop"></div>
    <section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
      <p class="expense-kicker">Preferences</p>
      <h2 id="settingsModalTitle">账户设置</h2>
      <div class="settings-scroll-body">
        <label class="expense-field settings-auth-field settings-connection-field">
          <span>Supabase URL</span>
          <input id="supabaseUrlInput" type="url" maxlength="200" placeholder="输入你的 Supabase 项目 URL">
        </label>
        <label class="expense-field settings-auth-field settings-connection-field">
          <span>Supabase Key</span>
          <input id="supabaseKeyInput" type="text" maxlength="300" placeholder="输入你的 publishable / anon key">
        </label>
        <label class="expense-field settings-auth-field settings-connection-field">
          <span>邮箱</span>
          <input id="emailInput" type="email" maxlength="60" placeholder="输入你的 Supabase 邮箱">
        </label>
        <label class="expense-field settings-auth-field settings-connection-field">
          <span>密码</span>
          <input id="passwordInput" type="password" maxlength="32" placeholder="输入你的密码">
        </label>
        <label class="expense-field settings-budget-field">
          <span>每月总额度</span>
          <input id="monthlyBudgetInput" type="number" min="0" step="100" placeholder="例如 5000">
        </label>
        <div class="expense-actions settings-actions">
            <button id="logoutSettingsBtn" class="expense-btn ghost settings-auth-action" type="button">登出</button>
          <button id="cancelSettingsBtn" class="expense-btn ghost" type="button">取消</button>
          <button id="saveSettingsBtn" class="expense-btn primary" type="button">保存</button>
        </div>
        <p id="settingsStatus" class="modal-status" aria-live="polite"></p>
      </div>
    </section>
  </div>

  <div id="historyModal" class="settings-modal" hidden>
    <div id="historyBackdrop" class="expense-backdrop"></div>
    <section class="settings-card history-card" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
      <p class="expense-kicker">Expense History</p>
      <h2 id="historyModalTitle">历史消费</h2>
      <div class="history-filter" role="tablist" aria-label="历史范围" data-active="today">
        <button id="historyTodayBtn" class="history-tab active" type="button" role="tab" aria-selected="true">今天</button>
        <button id="historyMonthBtn" class="history-tab" type="button" role="tab" aria-selected="false">本月</button>
      </div>
      <div id="historyPagerViewport" class="history-pager-viewport">
        <div id="historyPagerTrack" class="history-pager-track">
          <section class="history-page" aria-label="今天消费记录">
            <div id="historyTodayList" class="history-list"></div>
          </section>
          <section class="history-page" aria-label="本月消费记录">
            <div id="historyMonthList" class="history-list"></div>
          </section>
        </div>
      </div>
      <div class="expense-actions history-actions">
        <button id="closeHistoryBtn" class="expense-btn ghost" type="button">关闭</button>
      </div>
    </section>
  </div>

  <div id="statsModal" class="settings-modal" hidden>
    <div id="statsBackdrop" class="expense-backdrop"></div>
    <section class="settings-card stats-card" role="dialog" aria-modal="true" aria-labelledby="statsModalTitle">
      <p class="expense-kicker">Expense Stats</p>
      <h2 id="statsModalTitle">消费统计</h2>
      <div class="stats-chart-shell">
        <div id="expenseSunburstChart" class="stats-sunburst-chart" role="img" aria-label="本月消费分类旭日图"></div>
        <div id="statsEmptyState" class="stats-empty-state" hidden>本月还没有可统计的消费记录。</div>
      </div>
    </section>
  </div>

  <div id="sunburstTestModal" class="settings-modal" hidden>
    <div id="sunburstTestBackdrop" class="expense-backdrop"></div>
    <section class="settings-card stats-card sunburst-test-card" role="dialog" aria-modal="true" aria-labelledby="sunburstTestTitle">
      <p class="expense-kicker">Sunburst Test</p>
      <h2 id="sunburstTestTitle">旭日图测试</h2>
      <div class="sunburst-test-chart-shell">
        <div id="sunburstTestChart" class="sunburst-test-chart" role="img" aria-label="旭日图标签动画测试"></div>
      </div>
    </section>
  </div>

  <div id="deleteConfirmModal" class="settings-modal delete-confirm-modal" hidden>
    <div id="deleteConfirmBackdrop" class="expense-backdrop"></div>
    <section class="settings-card delete-confirm-card" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
      <p id="deleteConfirmKicker" class="expense-kicker">Delete Expense</p>
      <h2 id="deleteConfirmTitle">删除这笔消费？</h2>
      <p id="deleteConfirmText" class="delete-confirm-text"></p>
      <div class="expense-actions delete-confirm-actions">
        <button id="cancelDeleteExpenseBtn" class="expense-btn ghost" type="button">取消</button>
        <button id="confirmDeleteExpenseBtn" class="expense-btn danger" type="button">删除</button>
      </div>
    </section>
  </div>

  <div id="categoryAddModal" class="settings-modal category-add-modal" hidden>
    <div id="categoryAddBackdrop" class="expense-backdrop"></div>
    <section class="settings-card category-add-card" role="dialog" aria-modal="true" aria-labelledby="categoryAddTitle">
      <p class="expense-kicker">New Category</p>
      <h2 id="categoryAddTitle">添加分类</h2>
      <label class="expense-field category-add-field">
        <span>分类名称</span>
        <input id="categoryAddInput" type="text" maxlength="20" placeholder="输入新分类名称">
      </label>
      <p id="categoryAddStatus" class="modal-status" aria-live="polite"></p>
      <div class="expense-actions category-add-actions">
        <button id="cancelCategoryAddBtn" class="expense-btn ghost" type="button">取消</button>
        <button id="confirmCategoryAddBtn" class="expense-btn primary" type="button">添加</button>
      </div>
    </section>
  </div>

  <div id="releaseInfoModal" class="settings-modal" hidden>
    <div id="releaseInfoBackdrop" class="expense-backdrop"></div>
    <section class="settings-card release-info-card" role="dialog" aria-modal="true" aria-labelledby="releaseInfoTitle">
      <p class="expense-kicker">Preferences</p>
      <h2 id="releaseInfoTitle">设置</h2>
      <div class="settings-scroll-body">
        <div class="category-settings-panel" aria-labelledby="categorySettingsTitle">
          <div class="category-settings-head">
            <h3 id="categorySettingsTitle">分类设置</h3>
            <button id="syncCategoriesBtn" class="category-settings-sync" type="button" aria-label="同步云端分类" title="同步云端分类">
              <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
                <path d="M8.2 8.4H4.8V5"></path>
                <path d="M5.2 8.1a7.2 7.2 0 0 1 12-1.8"></path>
                <path d="M15.8 15.6h3.4V19"></path>
                <path d="M18.8 15.9a7.2 7.2 0 0 1-12 1.8"></path>
              </svg>
            </button>
          </div>
          <div id="categorySettingsTree" class="category-settings-tree" aria-label="自定义分类"></div>
          <button id="addRootCategoryBtn" class="category-settings-add root" type="button" aria-label="添加一级分类">+</button>
        </div>
        <div class="theme-panel" aria-labelledby="themePanelTitle">
          <h3 id="themePanelTitle">外观配色</h3>
          <div class="theme-options" role="radiogroup" aria-label="外观配色">
            <button id="themeDefaultBtn" class="theme-option active" type="button" role="radio" aria-checked="true" data-theme-value="default">
              <span class="theme-swatch default" aria-hidden="true"></span>
              <span>默认蓝色</span>
            </button>
            <button id="themeForestBtn" class="theme-option" type="button" role="radio" aria-checked="false" data-theme-value="forest">
              <span class="theme-swatch forest" aria-hidden="true"></span>
              <span>森绿色</span>
            </button>
          </div>
        </div>
        <div class="release-info-body">
          <h3 id="releaseVersionTitle">当前版本</h3>
          <p class="release-info-row">
            <strong id="currentVersionValue">v0.1.0</strong>
            <span id="releaseInfoStatus" class="release-info-status">当前已是最新版本</span>
          </p>
          <div id="releaseDownloadChoices" class="release-download-choices" hidden>
            <div class="release-download-actions">
              <a id="releaseGithubLink" class="expense-btn primary release-download-btn" href="https://github.com/cnjialin/budgetgauge/releases" target="_blank" rel="noopener noreferrer">GitHub</a>
              <a id="releaseBaiduLink" class="expense-btn primary release-download-btn" href="https://pan.baidu.com/s/1zKfk8u8o7KXZt4xQrNx8Dg?pwd=6666" target="_blank" rel="noopener noreferrer">百度云</a>
            </div>
          </div>
        </div>
        <div class="expense-actions release-info-actions">
          <button id="closeReleaseInfoBtn" class="expense-btn ghost" type="button">关闭</button>
        </div>
      </div>
      </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
